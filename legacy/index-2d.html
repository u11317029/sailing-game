<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>揚帆出航｜體感帆船</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0e4d5c; --deep:#08303a; --foam:#e8f4f2;
    --flag-yellow:#f2c230; --flag-red:#d6322b; --ink:#062027;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--deep);color:var(--foam);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #cam{position:fixed;right:16px;bottom:16px;width:220px;border-radius:10px;
    border:3px solid var(--flag-yellow);transform:scaleX(-1);background:#000;z-index:5}
  #skeleton{position:fixed;right:16px;bottom:16px;width:220px;z-index:6;pointer-events:none;border-radius:10px}
  #hud{position:fixed;left:16px;top:16px;z-index:5;display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:rgba(6,32,39,.75);padding:8px 14px;border-radius:6px;font-size:15px;
    border-left:5px solid var(--flag-yellow)}
  .chip b{font-size:20px;margin-left:6px}
  #panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(8,48,58,.82)}
  #panel.hidden{display:none}
  .card{max-width:560px;width:calc(100% - 40px);background:var(--foam);color:var(--ink);
    padding:32px;border-radius:4px;border-top:14px solid var(--flag-red);box-shadow:0 0 0 6px var(--flag-yellow)}
  .card h1{font-size:34px;font-weight:900;margin-bottom:12px}
  .card p{line-height:1.8;margin-bottom:12px}
  .card ul{margin:0 0 16px 20px;line-height:1.8}
  .card button{font:inherit;font-weight:700;font-size:18px;padding:12px 24px;border:none;cursor:pointer;
    background:var(--flag-red);color:#fff;border-radius:4px;margin-right:8px;margin-top:6px}
  .card button.alt{background:var(--sea)}
  .card button:focus-visible{outline:4px solid var(--flag-yellow);outline-offset:2px}
  #prompt{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:7;text-align:center;
    background:rgba(6,32,39,.85);padding:16px 26px;border-radius:6px;font-size:22px;font-weight:700;
    border-bottom:5px solid var(--flag-yellow);max-width:90%}
  #prompt.hidden{display:none}
  #prompt small{display:block;font-size:15px;font-weight:400;margin-top:6px;opacity:.85}
  .bar{height:10px;background:rgba(255,255,255,.2);border-radius:5px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--flag-yellow)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="cam" autoplay playsinline muted></video>
<canvas id="skeleton"></canvas>

<div id="hud">
  <div class="chip">時間<b id="t">0.0</b></div>
  <div class="chip">浮標<b id="b">0/3</b></div>
  <div class="chip">船速<b id="v">0</b></div>
  <div class="chip">帆<b id="trim">—</b></div>
</div>

<div id="prompt" class="hidden"><span id="ptext"></span><small id="psub"></small><div class="bar"><i id="pbar"></i></div></div>

<div id="panel"><div class="card" id="card">
  <h1>揚帆出航</h1>
  <p>站在鏡頭前約 2 公尺，讓上半身完整入鏡。你的身體就是舵和帆繩。</p>
  <ul>
    <li>身體向左或向右傾：轉向</li>
    <li>雙手靠攏在胸前：收帆；雙手往兩側張開：放帆</li>
    <li>風從畫面上方吹來，船不能正對著風開，要斜斜地走 Z 字形</li>
  </ul>
  <p>沒有鏡頭也能用鍵盤試玩：← → 轉向，↑ ↓ 收放帆，空白鍵做動作。</p>
  <button id="startCam">開啟鏡頭開始</button>
  <button id="startKey" class="alt">用鍵盤試玩</button>
</div></div>

<script type="module">
// ---------- 基本設定 ----------
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const sk = document.getElementById('skeleton'), sctx = sk.getContext('2d');
const video = document.getElementById('cam');
const $ = id => document.getElementById(id);
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; layoutBuoys(); }
addEventListener('resize', resize);

// ---------- 遊戲狀態 ----------
// phase: menu → jacket → sail → capsize → done
let phase = 'menu', useCam = false;
const boat = { x:0, y:0, h:0.8, v:0, trim:0.5, heel:0 };
let buoys = [], nextBuoy = 0, startTime = 0, elapsed = 0, holdTime = 0;
const input = { steer:0, trim:0.5, gesture:false, jacket:false, raise:false, visible:false };
const keys = {};
const streaks = Array.from({length:90}, () => ({x:Math.random(), y:Math.random(), s:0.5+Math.random()}));

function layoutBuoys(){
  buoys = [
    {x:W*0.30, y:H*0.25}, {x:W*0.72, y:H*0.30}, {x:W*0.55, y:H*0.75}
  ].map((p,i)=>({...p, done: buoys[i]?.done || false}));
}

// ---------- 姿勢偵測 (MediaPipe) ----------
let landmarker = null, lastVideoTime = -1;
async function initPose(){
  const { PoseLandmarker, FilesetResolver } =
    await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
  const files = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await PoseLandmarker.createFromOptions(files, {
    baseOptions:{ modelAssetPath:
      'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:'GPU' },
    runningMode:'VIDEO', numPoses:1
  });
  const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 } });
  video.srcObject = stream;
  await new Promise(r => video.onloadeddata = r);
}

function readPose(){
  if(!landmarker || video.readyState < 2) return;
  if(video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const lm = res.landmarks?.[0];
  sk.width = 220; sk.height = 220 * video.videoHeight / video.videoWidth;
  sctx.clearRect(0,0,sk.width,sk.height);
  if(!lm){ input.visible = false; return; }
  input.visible = true;
  // 鏡像：玩家的右邊 = 畫面右邊
  const P = i => ({ x:1 - lm[i].x, y:lm[i].y });
  const nose=P(0), lS=P(11), rS=P(12), lW=P(15), rW=P(16), lH=P(23), rH=P(24);
  const A = lS.x < rS.x ? lS : rS, B = lS.x < rS.x ? rS : lS; // A 在畫面左
  const shoulderW = Math.hypot(B.x-A.x, B.y-A.y) || 0.2;

  // 轉向：肩線傾斜角度
  const tilt = Math.atan2(B.y - A.y, B.x - A.x);
  const dead = 0.08;
  input.steer = Math.abs(tilt) < dead ? 0 : Math.max(-1, Math.min(1, (tilt - Math.sign(tilt)*dead) / 0.3));

  // 收放帆：雙手距離 / 肩寬
  const ratio = Math.hypot(lW.x-rW.x, lW.y-rW.y) / shoulderW;
  input.trim = Math.max(0, Math.min(1, (ratio - 0.8) / 2.4));

  // 穿救生衣：雙手都在肩膀和臀部之間、身體中線附近
  const midX = (A.x+B.x)/2, hipY = (lH.y+rH.y)/2, shY = (A.y+B.y)/2;
  const onChest = w => Math.abs(w.x - midX) < shoulderW*0.6 && w.y > shY && w.y < hipY;
  input.jacket = onChest(lW) && onChest(rW);

  // 舉手求救：任一手腕高過頭
  input.raise = lW.y < nose.y - 0.05 || rW.y < nose.y - 0.05;

  // 小視窗骨架
  sctx.strokeStyle = '#f2c230'; sctx.lineWidth = 3;
  const sx = p => p.x*sk.width, sy = p => p.y*sk.height;
  [[lS,rS],[lS,P(13)],[P(13),lW],[rS,P(14)],[P(14),rW],[lS,lH],[rS,rH],[lH,rH]].forEach(([a,b])=>{
    sctx.beginPath(); sctx.moveTo(sx(a),sy(a)); sctx.lineTo(sx(b),sy(b)); sctx.stroke();
  });
}

function readKeys(){
  input.visible = true;
  input.steer = (keys.ArrowRight?1:0) - (keys.ArrowLeft?1:0);
  if(keys.ArrowUp) input.trim = Math.max(0, input.trim - 0.015);
  if(keys.ArrowDown) input.trim = Math.min(1, input.trim + 0.015);
  input.jacket = input.raise = !!keys[' '];
}
addEventListener('keydown', e => { keys[e.key] = true; if(e.key===' ' && phase!=='menu') e.preventDefault(); });
addEventListener('keyup', e => keys[e.key] = false);

// ---------- 提示框 ----------
function showPrompt(text, sub, progress){
  $('prompt').classList.remove('hidden');
  $('ptext').textContent = text; $('psub').textContent = sub || '';
  $('pbar').style.width = (progress*100) + '%';
  $('pbar').parentElement.style.display = progress == null ? 'none' : 'block';
}
const hidePrompt = () => $('prompt').classList.add('hidden');

function showCard(html){ $('card').innerHTML = html; $('panel').classList.remove('hidden'); }

// ---------- 帆船物理（簡化） ----------
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const NO_GO = 0.75; // 約 43 度：逆風禁區

function sailPhysics(dt){
  boat.h += input.steer * 1.6 * dt * (0.4 + Math.min(boat.v/3, 1));
  boat.trim += (input.trim - boat.trim) * Math.min(1, dt*6);
  // 風從上方（北）吹來；與風的夾角 0 = 正對風
  const a = Math.abs(wrap(boat.h));
  const ideal = Math.max(0, Math.min(1, (a - NO_GO) / (Math.PI - NO_GO)));
  const eff = Math.max(0, 1 - Math.abs(boat.trim - ideal) * 2.2);
  const target = a < NO_GO ? 0 : (0.55 + 0.45*Math.sin(a)) * eff * 4;
  boat.v += (target - boat.v) * Math.min(1, dt * 0.9);
  boat.x += Math.sin(boat.h) * boat.v * 40 * dt;
  boat.y -= Math.cos(boat.h) * boat.v * 40 * dt;
  boat.x = Math.max(20, Math.min(W-20, boat.x));
  boat.y = Math.max(20, Math.min(H-20, boat.y));
  boat.heel = (1 - boat.trim) * Math.sin(a) * Math.sign(wrap(boat.h)) * 0.4;
  return { a, ideal, eff };
}

// ---------- 主迴圈 ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  useCam ? readPose() : readKeys();
  update(dt, now);
  draw(now);
  requestAnimationFrame(loop);
}

function update(dt, now){
  if(phase === 'jacket'){
    holdTime = input.jacket ? holdTime + dt : Math.max(0, holdTime - dt*2);
    showPrompt('出航前：先穿上救生衣',
      useCam ? '雙手放在胸前，像拉上拉鍊一樣停住' : '按住空白鍵', holdTime/1.5);
    if(holdTime >= 1.5){
      holdTime = 0; phase = 'sail'; startTime = now;
      showPrompt('救生衣穿好了，出發！', '依序繞過三個黃色浮標', null);
      setTimeout(()=>{ if(phase==='sail') hidePrompt(); }, 2500);
    }
  }
  if(phase === 'sail'){
    elapsed = (now - startTime)/1000;
    const s = sailPhysics(dt);
    if(s.a < NO_GO && boat.v < 0.3) showPrompt('船頭對著風，帆吃不到風了', '轉向斜邊，走 Z 字形前進', null);
    else if(!$('ptext').textContent.startsWith('救生衣')) hidePrompt();
    const bu = buoys[nextBuoy];
    if(bu && Math.hypot(boat.x-bu.x, boat.y-bu.y) < 45){
      bu.done = true; nextBuoy++;
      if(nextBuoy === buoys.length){ phase = 'capsize'; holdTime = 0; boat.v = 0; }
    }
    $('trim').textContent = boat.trim < 0.33 ? '收緊' : boat.trim < 0.66 ? '適中' : '放鬆';
  }
  if(phase === 'capsize'){
    boat.heel = Math.min(Math.PI/2, boat.heel + dt*3);
    holdTime = input.raise ? holdTime + dt : Math.max(0, holdTime - dt*2);
    showPrompt('一陣強風，船翻了！留在船邊，舉手求救',
      useCam ? '單手高舉過頭停住，不要游離翻覆的船' : '按住空白鍵', holdTime/2);
    if(holdTime >= 2){ phase = 'done'; hidePrompt(); finish(); }
  }
  $('t').textContent = elapsed.toFixed(1);
  $('b').textContent = `${nextBuoy}/${buoys.length}`;
  $('v').textContent = (boat.v*2).toFixed(1);
  if(useCam && !input.visible && phase !== 'menu' && phase !== 'done')
    showPrompt('看不到你了', '退後一點，讓肩膀和雙手都在鏡頭裡', null);
}

function finish(){
  showCard(`
    <h1>安全返航</h1>
    <p>完成時間：<b>${elapsed.toFixed(1)} 秒</b></p>
    <p>今天記住的三件事：</p>
    <ul>
      <li>出海一定穿好救生衣，這是第一步</li>
      <li>翻船時留在船邊，船比人顯眼，也能幫助漂浮</li>
      <li>舉手揮動求救，保留體力，不要嘗試游回岸邊</li>
    </ul>
    <button id="again">再航一次</button>`);
  $('again').onclick = reset;
}

function reset(){
  $('panel').classList.add('hidden');
  boat.x = W*0.2; boat.y = H*0.85; boat.h = 0.8; boat.v = 0; boat.heel = 0;
  buoys.forEach(b=>b.done=false); nextBuoy = 0; elapsed = 0; holdTime = 0;
  phase = 'jacket';
}

// ---------- 繪圖 ----------
function draw(now){
  // 海面
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0e4d5c'); g.addColorStop(1,'#08303a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 風紋（由上往下）
  ctx.strokeStyle = 'rgba(232,244,242,.18)'; ctx.lineWidth = 2;
  streaks.forEach(s=>{
    s.y += 0.0015 * s.s; if(s.y > 1.05) { s.y = -0.05; s.x = Math.random(); }
    ctx.beginPath(); ctx.moveTo(s.x*W, s.y*H); ctx.lineTo(s.x*W, s.y*H + 26*s.s); ctx.stroke();
  });
  // 風向旗
  ctx.save(); ctx.translate(W-60, 70);
  ctx.fillStyle = 'rgba(6,32,39,.75)'; ctx.beginPath(); ctx.arc(0,0,40,0,7); ctx.fill();
  ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.moveTo(-10,-22); ctx.lineTo(10,-22); ctx.lineTo(0,24); ctx.fill();
  ctx.fillStyle = '#e8f4f2'; ctx.font = '700 13px "Noto Sans TC"'; ctx.textAlign='center'; ctx.fillText('風向', 0, 58);
  ctx.restore();

  // 浮標
  buoys.forEach((b,i)=>{
    const pulse = i === nextBuoy ? 6*Math.sin(now/250) : 0;
    ctx.fillStyle = b.done ? 'rgba(232,244,242,.3)' : '#f2c230';
    ctx.beginPath(); ctx.arc(b.x, b.y, 16 + pulse*0.3, 0, 7); ctx.fill();
    if(i === nextBuoy){
      ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, 40 + pulse, 0, 7); ctx.stroke();
    }
    ctx.fillStyle = '#062027'; ctx.font = '900 16px "Noto Sans TC"'; ctx.textAlign='center';
    ctx.fillText(i+1, b.x, b.y+6);
  });

  // 逆風禁區提示（以船為中心）
  if(phase === 'sail'){
    ctx.save(); ctx.translate(boat.x, boat.y);
    ctx.fillStyle = 'rgba(214,50,43,.15)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,110,-Math.PI/2-NO_GO,-Math.PI/2+NO_GO); ctx.fill();
    ctx.restore();
  }

  // 帆船（俯視）
  if(phase !== 'menu'){
    ctx.save(); ctx.translate(boat.x, boat.y); ctx.rotate(boat.h);
    // 尾跡
    ctx.strokeStyle = `rgba(232,244,242,${0.15 + boat.v*0.08})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-6,22); ctx.lineTo(-14 - boat.v*4, 60 + boat.v*15);
    ctx.moveTo(6,22); ctx.lineTo(14 + boat.v*4, 60 + boat.v*15); ctx.stroke();
    // 船身（翻船時壓扁）
    ctx.scale(Math.cos(boat.heel), 1);
    ctx.fillStyle = '#e8f4f2';
    ctx.beginPath(); ctx.moveTo(0,-30); ctx.quadraticCurveTo(16,-5,11,24); ctx.lineTo(-11,24);
    ctx.quadraticCurveTo(-16,-5,0,-30); ctx.fill();
    // 帆：依照收放角度轉動，偏向下風側
    const side = wrap(boat.h) >= 0 ? -1 : 1;
    const sailAng = side * (0.15 + boat.trim * 1.2);
    ctx.save(); ctx.translate(0,-8); ctx.rotate(sailAng);
    ctx.strokeStyle = '#d6322b'; ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(side*-8,16,0,34); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#062027'; ctx.beginPath(); ctx.arc(0,-8,3,0,7); ctx.fill();
    ctx.restore();
  }
}

// ---------- 開始 ----------
$('startCam').onclick = async () => {
  $('startCam').textContent = '載入姿勢偵測中…'; $('startCam').disabled = true;
  try { await initPose(); useCam = true; reset(); }
  catch(err){
    console.error(err);
    showCard(`<h1>鏡頭沒有開啟</h1>
      <p>請確認瀏覽器已允許使用攝影機，並用 VS Code 的 Live Server 開啟這個檔案，而不是直接雙擊。</p>
      <p>錯誤訊息：${err.message}</p>
      <button id="retry">重新整理</button><button id="kb" class="alt">改用鍵盤試玩</button>`);
    $('retry').onclick = () => location.reload();
    $('kb').onclick = () => { video.style.display='none'; useCam=false; reset(); };
  }
};
$('startKey').onclick = () => { video.style.display='none'; useCam = false; reset(); };

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
